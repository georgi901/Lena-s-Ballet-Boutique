services:
  - type: web
    name: lena-ballet-boutique
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:scss
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lena-ballet-boutique-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: NEW_PRODUCT_DAYS
        value: "120"

databases:
  - name: lena-ballet-boutique-db
    plan: free
